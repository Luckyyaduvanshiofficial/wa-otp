<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="50%" stop-color="#0A1D1A" />
      <stop offset="100%" stop-color="#07120E" />
    </linearGradient>
    <linearGradient id="waGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25D366" />
      <stop offset="100%" stop-color="#128C7E" />
    </linearGradient>
    <linearGradient id="tgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#25D366" stroke-width="3" stroke-opacity="0.25" />

  <!-- Ambient Glow -->
  <circle cx="210" cy="240" r="160" fill="#25D366" opacity="0.12" filter="url(#glow)" />
  <circle cx="330" cy="200" r="120" fill="#38BDF8" opacity="0.1" filter="url(#glow)" />

  <!-- WhatsApp Speech Bubble (Shield / Shielded Bubble) -->
  <path
    fill="url(#waGrad)"
    d="M246 116 c-78 0 -142 58 -142 130 c0 26 8 50 23 71 l-15 54 l57 -15 c22 13 48 20 77 20 c78 0 142 -58 142 -130 s-64 -130 -142 -130 z"
  />

  <!-- Inside Bubble: Contrast Center -->
  <path
    fill="#FFFFFF"
    d="M246 138 c-66 0 -120 49 -120 110 c0 22 7 43 19 60 l-11 41 l43 -11 c19 11 42 17 69 17 c66 0 120 -49 120 -110 s-54 -107 -120 -107 z"
  />

  <!-- Central Key / OTP Verification Lock Emblem -->
  <g fill="url(#waGrad)">
    <!-- Lock Shackle -->
    <path
      d="M226 215 v-18 c0 -12 9 -21 20 -21 s20 9 20 21 v18 h-8 v-18 c0 -6 -5 -13 -12 -13 s-12 7 -12 13 v18 z"
    />
    <!-- Lock Body -->
    <rect x="216" y="215" width="60" height="46" rx="8" />
    <!-- Keyhole -->
    <circle cx="246" cy="234" r="5" fill="#FFFFFF" />
    <polygon points="244,234 248,234 250,250 242,250" fill="#FFFFFF" />
  </g>

  <!-- 3 OTP PIN Dots -->
  <circle cx="204" cy="285" r="9" fill="#128C7E" />
  <circle cx="246" cy="285" r="9" fill="#128C7E" />
  <circle cx="288" cy="285" r="9" fill="#128C7E" />

  <!-- Telegram Wing Accent Badge in Top Right -->
  <circle cx="366" cy="146" r="44" fill="url(#tgGrad)" stroke="#0A1D1A" stroke-width="6" />
  <path
    fill="#FFFFFF"
    d="M348 146 l36 -15 c3 -1 5 1 4 4 l-6 30 c-1 3 -3 4 -5 2 l-9 -7 l-5 5 c-1 1 -2 2 -4 2 l1 -11 l20 -18 c1 -1 0 -1 -1 0 l-25 16 l-11 -3 c-3 -1 -3 -3 0 -4 z"
  />
</svg>
