<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D1A" />
      <stop offset="50%" stop-color="#060913" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="rimBorder" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.7" />
    </linearGradient>

    <!-- Left Wing Front (WhatsApp Emerald-Mint) -->
    <linearGradient id="waFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="30%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Left Wing Shadow/Depth -->
    <linearGradient id="waDepth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Right Wing Front (Telegram Electric Cyan) -->
    <linearGradient id="tgFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="40%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Right Wing Shadow/Depth -->
    <linearGradient id="tgDepth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <!-- Center Key / Shield (Gold-Brass & Radiant White) -->
    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Deep Ambient Glow -->
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur" />
    </filter>

    <filter id="coreGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur" />
    </filter>
  </defs>

  <!-- Squircle Base Tile -->
  <rect width="512" height="512" rx="116" fill="url(#canvasBg)" />
  <rect x="3" y="3" width="506" height="506" rx="113" fill="none" stroke="url(#rimBorder)" stroke-width="4" />

  <!-- Soft Ambient Lights -->
  <circle cx="155" cy="270" r="150" fill="#10B981" opacity="0.16" filter="url(#glowFilter)" />
  <circle cx="357" cy="270" r="150" fill="#0EA5E9" opacity="0.16" filter="url(#glowFilter)" />
  <circle cx="256" cy="200" r="95" fill="#F59E0B" opacity="0.16" filter="url(#glowFilter)" />

  <!-- ================= MASTER EMBLEM: THE APEX W-AUTH KEY ================= -->
  <g transform="translate(0, -2)">
    <!-- LEFT WING (WHATSAPP DUAL-TONE FACET) -->
    <!-- Outer Left Pillar -->
    <path
      d="M 94 140
         C 94 124, 110 116, 124 126
         L 174 164
         C 182 170, 186 180, 186 190
         L 186 332
         C 186 350, 166 360, 150 350
         L 110 324
         C 100 318, 94 306, 94 294
         Z"
      fill="url(#waFront)"
    />

    <!-- Left Center Chevron (Beveled Interior Facet) -->
    <path
      d="M 186 332
         L 242 194
         C 248 180, 264 180, 270 194
         L 238 358
         C 232 374, 214 380, 202 370
         L 186 354
         Z"
      fill="url(#waDepth)"
    />

    <!-- RIGHT WING (TELEGRAM DUAL-TONE FACET) -->
    <!-- Outer Right Pillar -->
    <path
      d="M 418 140
         C 418 124, 402 116, 388 126
         L 338 164
         C 330 170, 326 180, 326 190
         L 326 332
         C 326 350, 346 360, 362 350
         L 402 324
         C 412 318, 418 306, 418 294
         Z"
      fill="url(#tgFront)"
    />

    <!-- Right Center Chevron (Beveled Interior Facet) -->
    <path
      d="M 326 332
         L 270 194
         C 264 180, 248 180, 242 194
         L 274 358
         C 280 374, 298 380, 310 370
         L 326 354
         Z"
      fill="url(#tgDepth)"
    />

    <!-- ================= THE CENTRAL AUTH SHIELD & KEYHOLE ================= -->
    <!-- Ambient Shield Aura -->
    <path
      d="M 256 114
         L 302 144
         C 302 208, 282 248, 256 266
         C 230 248, 210 208, 210 144
         Z"
      fill="#F59E0B"
      opacity="0.4"
      filter="url(#coreGlow)"
    />

    <!-- Golden Shield Body -->
    <path
      d="M 256 114
         L 302 144
         C 302 208, 282 248, 256 266
         C 230 248, 210 208, 210 144
         Z"
      fill="url(#keyGrad)"
    />

    <!-- Precision Cut Keyhole -->
    <circle cx="256" cy="168" r="14" fill="#060913" />
    <polygon points="251,168 261,168 265,208 247,208" fill="#060913" />

    <!-- Lightning Spark at Apex -->
    <polygon
      points="256,82 267,108 255,108 262,130 247,104 254,104"
      fill="#FFFFFF"
      filter="url(#coreGlow)"
    />
    <polygon
      points="256,82 267,108 255,108 262,130 247,104 254,104"
      fill="#FFFFFF"
    />

    <!-- 3-Dot OTP Verification Nodes -->
    <circle cx="194" cy="416" r="14" fill="#10B981" />
    <circle cx="256" cy="416" r="16" fill="#FFFFFF" />
    <circle cx="318" cy="416" r="14" fill="#38BDF8" />
  </g>
</svg>